[project]
name = "mcp-readonly-gateway"
dynamic = ["version"]
description = "An MCP server that puts a third-party API behind a narrow, audited, least-privilege tool surface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Garzón", email = "fechegarzon@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "llm", "agents", "security", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.2,<3",
    "pyyaml>=6.0.2,<7",
]

[project.urls]
Homepage = "https://github.com/fechegarzon/mcp-readonly-gateway"
"Related writeup" = "https://github.com/fechegarzon/ai-systems-in-production"

[project.scripts]
mcp-readonly-gateway = "mcp_readonly_gateway.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mcp_readonly_gateway/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_readonly_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
